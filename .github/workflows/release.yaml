name: release

on:
  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_REPO: 13210541230/CLIProxyAPI
  MANAGEMENT_CENTER_REPO: 13210541230/Cli-Proxy-API-Management-Center
  # Keep the embedded manager source immutable and auditable for each CPA release.
  MANAGEMENT_CENTER_REF: 1252b390f61e5f8ea9dfc038165df89dbdf155ab
  GO_VERSION: '1.26.4'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-linux-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
          - `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.

          ## Enterprise access-audit plugin

          - Plugin-capable Windows, macOS, and Linux glibc archives include the `enterprise-access-audit` dynamic library under `plugins/<GOOS>/<GOARCH>/`. Windows ARM64 uses a pinned LLVM MinGW cross-toolchain.
          - The plugin is built with the matching platform toolchain and uses CPA's C-shared plugin ABI. `*_no-plugin` and FreeBSD archives do not include it.

          ## FreeBSD release assets

          - `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.

          <!-- cliproxyapi-linux-release-assets:end -->
          EOF

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$generated_notes_file"
          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          fi

  build-hosted:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-latest
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Install LLVM MinGW for Windows ARM64
        if: ${{ matrix.target == 'windows-arm64' }}
        shell: pwsh
        run: |
          $version = '20260826'
          $archive = "llvm-mingw-$version-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive"
          $zipPath = Join-Path $env:RUNNER_TEMP $archive
          $extractPath = Join-Path $env:RUNNER_TEMP "llvm-mingw-$version"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $expected = 'AE601F4E0F72BBDF441AD2DF8BB16F037E2E9251559EA6B37B4057AEF39C06C3'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash
          if ($actual -ne $expected) {
            throw "LLVM MinGW checksum mismatch: $actual"
          }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extractPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath
          $compiler = Get-ChildItem -Path $extractPath -Recurse -Filter 'aarch64-w64-mingw32-clang.exe' | Select-Object -First 1
          if ($null -eq $compiler) {
            throw 'aarch64-w64-mingw32-clang.exe was not found in LLVM MinGW archive'
          }
          "LLVM_MINGW_CC=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_REF_NAME^{}")"
          build_date="$(SOURCE_DATE_EPOCH="$source_date_epoch" python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          if [[ "$GOOS" == "windows" && "$GOARCH" == "arm64" ]]; then
            (
              cd plugins/enterprise-access-audit/go
              unset GOOS GOARCH
              CC=gcc CGO_ENABLED=1 go test ./...
              CC=gcc CGO_ENABLED=1 go test -race ./...
              CC=gcc CGO_ENABLED=1 go build -buildvcs=false ./...
            )
          else
            (
              cd plugins/enterprise-access-audit/go
              go test ./...
              go test -race ./...
              go build -buildvcs=false ./...
            )
          fi

          cgo_enabled=1
          if [[ "$GOOS" == "windows" && "$GOARCH" == "arm64" ]]; then
            cgo_enabled=0
          fi
          CGO_ENABLED="$cgo_enabled" GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          repo_root="$PWD"
          plugin_extension=".so"
          if [[ "$GOOS" == "windows" ]]; then
            plugin_extension=".dll"
          elif [[ "$GOOS" == "darwin" ]]; then
            plugin_extension=".dylib"
          fi
          plugin_dir="$archive_dir/plugins/${GOOS}/${GOARCH}"
          mkdir -p "$plugin_dir" "$archive_dir/plugins/enterprise-access-audit"
          (
            cd "$repo_root/plugins/enterprise-access-audit/go"
            if [[ "$GOOS" == "windows" && "$GOARCH" == "arm64" ]]; then
              CGO_ENABLED=1 CC="$LLVM_MINGW_CC" GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false -buildmode=c-shared \
                -o "$repo_root/$plugin_dir/enterprise-access-audit${plugin_extension}" .
            else
              CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false -buildmode=c-shared \
                -o "$repo_root/$plugin_dir/enterprise-access-audit${plugin_extension}" .
            fi
          )
          rm -f "$plugin_dir/enterprise-access-audit.h"
          cp plugins/enterprise-access-audit/README.md plugins/enterprise-access-audit/README_CN.md "$archive_dir/plugins/enterprise-access-audit/"

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml plugins
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/CLIProxyAPI_*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_REF_NAME^{}")"
          build_date="$(SOURCE_DATE_EPOCH="$source_date_epoch" python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          plugin_output_dir="/src/${archive_dir}/plugins/linux/${GOARCH}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir/plugins/enterprise-access-audit" "$archive_dir/plugins/linux/${GOARCH}"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            -e "PLUGIN_OUTPUT_DIR=${plugin_output_dir}" \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              (
                cd /src/plugins/enterprise-access-audit/go
                go test ./...
                go test -race ./...
                go build -buildvcs=false ./...
              )

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              mkdir -p "${PLUGIN_OUTPUT_DIR}"
              (
                cd /src/plugins/enterprise-access-audit/go
                CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false -buildmode=c-shared \
                  -o "${PLUGIN_OUTPUT_DIR}/enterprise-access-audit.so" .
              )
              rm -f "${PLUGIN_OUTPUT_DIR}/enterprise-access-audit.h"

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi

              plugin_glibc_versions="$(readelf --version-info "${PLUGIN_OUTPUT_DIR}/enterprise-access-audit.so" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${plugin_glibc_versions}" ]]; then
                printf "enterprise-access-audit GLIBC versions:\n%s\n" "${plugin_glibc_versions}"
                plugin_max_glibc="$(printf "%s\n" "${plugin_glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${plugin_max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "enterprise-access-audit linux ${GOARCH} requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${plugin_max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp plugins/enterprise-access-audit/README.md plugins/enterprise-access-audit/README_CN.md "$archive_dir/plugins/enterprise-access-audit/"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml plugins
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_REF_NAME^{}")"
          build_date="$(SOURCE_DATE_EPOCH="$source_date_epoch" python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Generate Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_REF_NAME^{}")"
          build_date="$(SOURCE_DATE_EPOCH="$source_date_epoch" python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        with:
          dir: .
          packages: ./cmd/server/
          targets: ${{ env.TARGET }}
          out-dir: dist/${{ env.TARGET }}/bin
          output: cli-proxy-api
          flags: >-
            -ldflags=-s -w
            -X main.Version=${{ steps.metadata.outputs.release_version }}
            -X main.Commit=${{ steps.metadata.outputs.commit }}
            -X main.BuildDate=${{ steps.metadata.outputs.build_date }}
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
      - name: Refresh release checksums
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'CLIProxyAPI_*.tar.gz' \
            --pattern 'CLIProxyAPI_*.zip' \
            --dir "$tmp_dir" \
            --clobber
          (
            cd "$tmp_dir"
            shopt -s nullglob
            archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
            if [[ ${#archives[@]} -eq 0 ]]; then
              echo "No release archives found"
              exit 0
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archives[@]}" | sort -k2 > checksums.txt
            else
              shasum -a 256 "${archives[@]}" | sort -k2 > checksums.txt
            fi
          )
          gh release upload "$GITHUB_REF_NAME" "$tmp_dir/checksums.txt" --clobber

  build-unified:
    name: build CPA suite bundle
    needs:
      - prepare-release
      - build-hosted
      - build-linux-glibc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: dist/standalone
          merge-multiple: true
      - name: Build CPA-Manager source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${MANAGEMENT_CENTER_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "MANAGEMENT_CENTER_REF must be a full immutable commit SHA" >&2
            exit 1
          fi
          rm -rf /tmp/cpa-manager
          git init /tmp/cpa-manager
          git -C /tmp/cpa-manager remote add origin "https://github.com/${MANAGEMENT_CENTER_REPO}.git"
          git -C /tmp/cpa-manager fetch --depth 1 --tags origin "${MANAGEMENT_CENTER_REF}"
          git -C /tmp/cpa-manager checkout --detach FETCH_HEAD
          manager_commit="$(git -C /tmp/cpa-manager rev-parse HEAD)"
          manager_version="$(git -C /tmp/cpa-manager describe --tags --exact-match HEAD 2>/dev/null || git -C /tmp/cpa-manager describe --tags --always HEAD)"
          printf '%s\n' "$manager_commit" > /tmp/cpa-manager-commit
          printf '%s\n' "$manager_version" > /tmp/cpa-manager-version
          cd /tmp/cpa-manager
          npm ci
          VERSION="${manager_version}" npm run build
          python3 bin/release/normalize-embedded-html.py \
            dist/index.html usage-service/internal/httpapi/web/management.html
      - name: Build suite archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manager_source=/tmp/cpa-manager/usage-service
          manager_html="${manager_source}/internal/httpapi/web/management.html"
          manager_commit="$(cat /tmp/cpa-manager-commit)"
          manager_version="$(cat /tmp/cpa-manager-version)"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_REF_NAME^{}")"
          build_date="$(SOURCE_DATE_EPOCH="$source_date_epoch" python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          manager_bins=/tmp/cpa-manager-bins
          suite_dir="dist/unified"
          rm -rf "$manager_bins" "$suite_dir"
          mkdir -p "$manager_bins" "$suite_dir"
          python3 - "$manager_version" "$manager_commit" > "$suite_dir/manager-build.json" <<'PY'
          import json
          import sys
          print(json.dumps({'version': sys.argv[1], 'commit': sys.argv[2]}, indent=2))
          PY

          targets=(
            "windows amd64 amd64 zip"
            "windows arm64 aarch64 zip"
            "darwin amd64 amd64 tar.gz"
            "darwin arm64 aarch64 tar.gz"
            "linux amd64 amd64 tar.gz"
            "linux arm64 aarch64 tar.gz"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch release_arch archive_format <<<"$target"
            archive_name="CLIProxyAPI_${version}_${goos}_${release_arch}.${archive_format}"
            archive_path="$(find dist/standalone -type f -name "$archive_name" -print -quit)"
            if [[ -z "$archive_path" ]]; then
              echo "missing standalone archive: $archive_name" >&2
              exit 1
            fi

            extract_dir="$(mktemp -d)"
            archive_status=0
            if [[ "$archive_format" == "zip" ]]; then
              # PowerShell-created Windows archives may return exit 1 for a
              # backslash-separator warning even when extraction succeeds.
              unzip -q "$archive_path" -d "$extract_dir" || archive_status=$?
              # Normalize permissions carried by Windows-created archives before copying resources.
              chmod -R u+rwX "$extract_dir" 2>/dev/null || true
            else
              tar -xzf "$archive_path" -C "$extract_dir"
            fi

            server_name="cli-proxy-api"
            ext=""
            if [[ "$goos" == "windows" ]]; then
              server_name="cli-proxy-api.exe"
              ext=".exe"
            fi
            server_bin="$(find "$extract_dir" -type f -name "$server_name" -print -quit 2>/dev/null || true)"
            if [[ -z "$server_bin" ]]; then
              echo "missing ${server_name} in ${archive_name} (archive status ${archive_status})" >&2
              exit 1
            fi
            if [[ "$archive_status" -ne 0 ]]; then
              echo "archive extraction returned ${archive_status}; required files were extracted" >&2
            fi
            package_dir="$(dirname "$server_bin")"

            manager_bin="${manager_bins}/${goos}_${goarch}/cpa-manager${ext}"
            updater_bin="${manager_bins}/${goos}_${goarch}/cpa-updater${ext}"
            mkdir -p "$(dirname "$manager_bin")"
            (
              cd "$manager_source"
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
                -ldflags "-s -w -X github.com/seakee/cpa-manager/usage-service/internal/buildinfo.Version=${manager_version} -X github.com/seakee/cpa-manager/usage-service/internal/buildinfo.Commit=${manager_commit} -X github.com/seakee/cpa-manager/usage-service/internal/buildinfo.BuildDate=${build_date}" \
                -o "$manager_bin" ./cmd/cpa-manager
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w" \
                -o "$updater_bin" ./cmd/cpa-updater
            )

            bash release/package-unified.sh \
              --version "${GITHUB_REF_NAME}" \
              --os "$goos" \
              --arch "$release_arch" \
              --server-bin "$server_bin" \
              --server-package-dir "$package_dir" \
              --usage-bin "$manager_bin" \
              --updater-bin "$updater_bin" \
              --management-html "$manager_html" \
              --output-dir "$suite_dir"
            rm -rf "$extract_dir"
          done
          find "$suite_dir" -maxdepth 1 -type f -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: unified-suite
          path: |
            dist/unified/CLIProxyAPI-Suite_*.tar.gz
            dist/unified/CLIProxyAPI-Suite_*.zip
            dist/unified/manager-build.json
          if-no-files-found: error

  publish-unified:
    runs-on: ubuntu-latest
    needs: build-unified
    if: needs.build-unified.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unified-suite
          path: dist/unified
      - name: Generate suite checksums and manifest
        shell: bash
        env:
          UPDATE_REPOSITORY: 13210541230/CLIProxyAPI
        run: |
          set -euo pipefail
          export RELEASE_TAG="$GITHUB_REF_NAME"
          export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('dist/unified')
          version = os.environ['RELEASE_VERSION']
          tag = os.environ['RELEASE_TAG']
          repository = os.environ['UPDATE_REPOSITORY']
          specs = [
              ('windows', 'amd64', 'amd64', 'zip'),
              ('windows', 'arm64', 'aarch64', 'zip'),
              ('darwin', 'amd64', 'amd64', 'tar.gz'),
              ('darwin', 'arm64', 'aarch64', 'tar.gz'),
              ('linux', 'amd64', 'amd64', 'tar.gz'),
              ('linux', 'arm64', 'aarch64', 'tar.gz'),
          ]
          assets = []
          checksum_lines = []
          for os_name, arch, release_arch, extension in specs:
              name = f'CLIProxyAPI-Suite_{version}_{os_name}_{release_arch}.{extension}'
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'missing unified asset: {path}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksum_lines.append(f'{digest}  {name}')
              assets.append({
                  'os': os_name,
                  'arch': arch,
                  'name': name,
                  'format': extension,
                  'downloadUrl': f'https://github.com/{repository}/releases/download/{tag}/{name}',
                  'sha256': digest,
                  'size': path.stat().st_size,
              })
          Path('suite-checksums.txt').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')
          metadata_path = Path('dist/unified/manager-build.json')
          if not metadata_path.is_file():
              raise SystemExit(f'missing manager build metadata: {metadata_path}')
          manager_metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          manifest = {
              'schema': 1,
              'bundleVersion': version,
              'releaseTag': tag,
              'cpaVersion': version,
              'managerVersion': manager_metadata['version'],
              'managerCommit': manager_metadata['commit'],
              'releaseUrl': f'https://github.com/{repository}/releases/tag/{tag}',
              'assets': assets,
          }
          Path('manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          cat manifest.json
          cat suite-checksums.txt
      - name: Upload suite release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/unified/CLIProxyAPI-Suite_*.tar.gz dist/unified/CLIProxyAPI-Suite_*.zip)
          if [[ ${#assets[@]} -ne 6 ]]; then
            echo "expected six suite assets, found ${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" manifest.json suite-checksums.txt \
            --repo "$GH_REPO" --clobber

  publish-checksums:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found"
            exit 0
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber
