<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise Access Audit</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--muted:#64748b;--text:#172033;--brand:#2563eb;--brand-soft:#eff6ff;--danger:#dc2626;--success:#15803d;--warn:#b45309;--shadow:0 12px 30px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 12px}button:hover{border-color:#93c5fd;background:#f8fbff}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.danger{color:var(--danger)}button.small{padding:5px 9px;font-size:12px}.shell{max-width:1440px;margin:0 auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:4px 0 4px;font-size:26px}.hero p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted)}.tab.active{color:var(--brand);background:var(--brand-soft);font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:16px}.card .label{color:var(--muted);font-size:12px}.card .value{font-size:25px;font-weight:750;margin-top:4px}.panel{padding:18px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;color:var(--text)}input:focus,select:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}.table th{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap}.table tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;background:#f1f5f9;color:#475569}.badge.success{background:#ecfdf5;color:var(--success)}.badge.warn{background:#fffbeb;color:var(--warn)}.badge.danger{background:#fef2f2;color:var(--danger)}.muted{color:var(--muted)}.empty,.loading,.error{padding:32px;text-align:center;color:var(--muted)}.error{color:var(--danger);background:#fff1f2;border-radius:10px}.detail{word-break:break-word;background:#f8fafc;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:520px;overflow:auto}.message-markdown{font-size:14px;line-height:1.75}.message-markdown p{margin:0 0 12px}.message-markdown p:last-child{margin-bottom:0}.message-markdown h1,.message-markdown h2,.message-markdown h3{margin:0 0 10px;line-height:1.3}.message-markdown h1{font-size:20px}.message-markdown h2{font-size:18px}.message-markdown h3{font-size:16px}.message-markdown ul{margin:0 0 12px;padding-left:22px}.message-markdown li{margin:4px 0}.message-markdown blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid #93c5fd;background:#eff6ff;color:#475569}.message-markdown pre{margin:0 0 12px;padding:12px;overflow:auto;border-radius:8px;background:#0f172a;color:#e2e8f0;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.message-markdown code{padding:2px 5px;border-radius:4px;background:#e2e8f0;color:#334155;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.message-markdown pre code{padding:0;background:transparent;color:inherit}.message-markdown a{color:var(--brand);text-decoration:underline}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.7fr);gap:18px}.policy-input{min-width:240px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.footer-note{color:var(--muted);font-size:12px;margin-top:12px}@media(max-width:900px){.shell{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.hero{flex-direction:column}}@media(max-width:520px){.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.hero h1{font-size:22px}}
  </style>
</head>
<body>
  <main id="app"><div class="loading">正在连接插件管理接口…</div></main>
  <div id="toast" class="toast"></div>
  <script>
    (() => {
      'use strict';
      const API = '/v0/management/enterprise-access-audit';
      const hostOrigin = (() => {
        try {
          const explicit = new URLSearchParams(window.location.search).get('cpa_plugin_host_origin');
          if (explicit && new URL(explicit).origin === explicit) return explicit;
          return document.referrer ? new URL(document.referrer).origin : '*';
        } catch (_) { return '*'; }
      })();
      const pending = new Map();
      let sequence = 0;
      const state = { tab:'audit', records:[], policies:[], settings:null, pagination:{page:1,page_size:25,total:0,has_next:false}, filters:{key_hash:'',model:'',source_format:'',outcome:'',security_signal:''}, detail:null, loading:false };
      let refreshTimer = 0;
      let auditRefreshBusy = false;
      const $ = (selector) => document.querySelector(selector);
      const escapeHTML = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const renderInline = (value) => {
        const codeTokens = [];
        let text = escapeHTML(value);
        text = text.replace(/`([^`\n]+)`/g, (_, code) => { const token = '\u0000code' + codeTokens.length + '\u0000'; codeTokens.push('<code>' + code + '</code>'); return token; });
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => '<a href="' + url + '" target="_blank" rel="noreferrer noopener">' + label + '</a>');
        text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
        text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
        text = text.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
        return text.replace(/\u0000code(\d+)\u0000/g, (_, index) => codeTokens[Number(index)] || '');
      };
      const renderMarkdown = (value) => {
        const lines = String(value == null ? '' : value).replace(/\r\n/g, '\n').split('\n');
        let html = '';
        let paragraph = [];
        let listOpen = false;
        let codeOpen = false;
        let codeLines = [];
        const flushParagraph = () => { if (paragraph.length) { html += '<p>' + paragraph.map(renderInline).join('<br>') + '</p>'; paragraph = []; } };
        const closeList = () => { if (listOpen) { html += '</ul>'; listOpen = false; } };
        const closeCode = () => { if (codeOpen) { html += '<pre><code>' + escapeHTML(codeLines.join('\n')) + '</code></pre>'; codeLines = []; codeOpen = false; } };
        lines.forEach((line) => {
          if (codeOpen) { if (/^```\s*$/.test(line)) closeCode(); else codeLines.push(line); return; }
          if (/^```/.test(line)) { flushParagraph(); closeList(); codeOpen = true; return; }
          if (!line.trim()) { flushParagraph(); closeList(); return; }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { flushParagraph(); closeList(); const level = heading[1].length; html += '<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>'; return; }
          const listItem = line.match(/^\s*[-*+]\s+(.+)$/);
          if (listItem) { flushParagraph(); if (!listOpen) { html += '<ul>'; listOpen = true; } html += '<li>' + renderInline(listItem[1]) + '</li>'; return; }
          if (listOpen) closeList();
          const quote = line.match(/^\s*>\s?(.*)$/);
          if (quote) { flushParagraph(); html += '<blockquote>' + renderInline(quote[1]) + '</blockquote>'; return; }
          paragraph.push(line);
        });
        flushParagraph(); closeList(); closeCode();
        return html || '<p class="muted">文本为空</p>';
      };
      const maskHash = (value) => { const text = String(value || ''); return text.length > 12 ? text.slice(0,8) + '…' + text.slice(-4) : text || '-'; };
      const formatTimestamp = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? String(value || '-') : date.toLocaleString(undefined, {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}); };
      const showToast = (message) => { const node = $('#toast'); node.textContent = message; node.classList.add('show'); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => node.classList.remove('show'), 2600); };
      const refreshLatestAudit = async () => { if (auditRefreshBusy || state.loading || document.visibilityState === 'hidden') return; auditRefreshBusy = true; try { applyAudit(await loadAudit(state.pagination.page || 1)); render(); } catch (_) { /* Keep the current page when a background refresh is temporarily unavailable. */ } finally { auditRefreshBusy = false; } };
      const startAutoRefresh = () => { if (refreshTimer) return; refreshTimer = window.setInterval(() => { void refreshLatestAudit(); }, 10000); };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') void refreshLatestAudit(); });
      const callHost = (method, path, body) => new Promise((resolve, reject) => {
        const id = 'audit-' + (++sequence);
        const timer = window.setTimeout(() => { pending.delete(id); reject(new Error('管理接口请求超时')); }, 15000);
        pending.set(id, {resolve, reject, timer});
        window.parent.postMessage({type:'cpa-plugin-api-request', id, method, path, body}, hostOrigin);
      });
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || (hostOrigin !== '*' && event.origin !== hostOrigin) || !event.data || event.data.type !== 'cpa-plugin-api-response') return;
        const item = pending.get(String(event.data.id || ''));
        if (!item) return;
        pending.delete(String(event.data.id));
        window.clearTimeout(item.timer);
        if (event.data.ok) item.resolve(event.data.data);
        else item.reject(new Error(event.data.error || ('管理接口请求失败（HTTP ' + (event.data.status || 0) + '）')));
      });
      const queryString = (values) => Object.entries(values).filter(([, value]) => String(value || '').trim()).map(([key, value]) => encodeURIComponent(key) + '=' + encodeURIComponent(value)).join('&');
      const load = async () => {
        state.loading = true; render();
        try {
          const [settings, policies, audit] = await Promise.all([
            callHost('GET', API + '/settings'),
            callHost('GET', API + '/policies'),
            loadAudit(1)
          ]);
          state.settings = settings || null;
          state.policies = Array.isArray(policies && policies.policies) ? policies.policies : [];
          if (audit) applyAudit(audit);
          state.loading = false; render();
          startAutoRefresh();
        } catch (error) {
          state.loading = false;
          renderError(error && error.message ? error.message : '插件管理接口不可用');
        }
      };
      const loadAudit = async (page) => {
        const query = queryString(Object.assign({}, state.filters, {page:page || 1, page_size:state.pagination.page_size || 25}));
        return callHost('GET', API + '/audit?' + query);
      };
      const applyAudit = (payload) => { state.records = Array.isArray(payload && payload.records) ? payload.records : []; state.pagination = (payload && payload.pagination) || {page:1,page_size:25,total:0,has_next:false}; };
      const refreshAudit = async (page) => { if (auditRefreshBusy) return; auditRefreshBusy = true; try { applyAudit(await loadAudit(page || state.pagination.page || 1)); state.detail = null; render(); } catch (error) { showToast(error.message || '审计记录加载失败'); } finally { auditRefreshBusy = false; } };
      const savePolicy = async (hash) => {
        const models = ($('#models-' + hash) || {}).value || '';
        const audit = ($('#audit-' + hash) || {}).checked;
        try { await callHost('PUT', API + '/policy', {key_hash:hash, denied_models:models.split(',').map((item) => item.trim()).filter(Boolean), audit_enabled:audit}); showToast('策略已保存'); await refreshPolicies(); } catch (error) { showToast(error.message || '策略保存失败'); }
      };
      const refreshPolicies = async () => { try { const payload = await callHost('GET', API + '/policies'); state.policies = Array.isArray(payload && payload.policies) ? payload.policies : []; render(); } catch (error) { showToast(error.message || '策略加载失败'); } };
      const saveSettings = async () => {
        const retention = Number($('#retention').value);
        const maxText = Number($('#max-text').value);
        const defaultAudit = $('#default-audit').checked;
        try { state.settings = await callHost('PUT', API + '/settings', {retention_days:retention, max_text_bytes:maxText, default_audit_enabled:defaultAudit}); showToast('设置已保存'); render(); } catch (error) { showToast(error.message || '设置保存失败'); }
      };
      const detail = async (id) => { try { state.detail = await callHost('GET', API + '/audit/detail?id=' + encodeURIComponent(id)); render(); } catch (error) { showToast(error.message || '详情加载失败'); } };
      const renderError = (message) => {
        $('#app').innerHTML = '<div class="shell"><div class="error"><strong>Enterprise Access Audit 暂不可用</strong><div>' + escapeHTML(message) + '</div><button class="small" data-action="reload" style="margin-top:12px">重新加载</button></div></div>';
        bindEvents();
      };
      const render = () => {
        if (state.loading) { $('#app').innerHTML = '<div class="shell"><div class="loading">正在加载插件数据…</div></div>'; return; }
        const enabledPolicies = state.policies.filter((item) => item.audit_enabled !== false).length;
        const deniedPolicies = state.policies.filter((item) => item.denied_models && item.denied_models.length).length;
        $('#app').innerHTML = '<div class="shell">' +
          '<header class="hero"><div><div class="eyebrow">Plugin workspace</div><h1>Enterprise Access Audit</h1><p>插件自主管理访问策略、审计记录和数据保留设置，审计列表每 10 秒自动刷新，时间按本机时区显示。</p></div><div class="actions"><button class="small" data-action="reload">刷新</button></div></header>' +
          '<nav class="tabs"><button class="tab ' + (state.tab === 'audit' ? 'active' : '') + '" data-tab="audit">审计记录</button><button class="tab ' + (state.tab === 'policies' ? 'active' : '') + '" data-tab="policies">访问策略</button><button class="tab ' + (state.tab === 'settings' ? 'active' : '') + '" data-tab="settings">插件设置</button></nav>' +
          '<section class="cards"><div class="card"><div class="label">审计记录</div><div class="value">' + escapeHTML(state.pagination.total || 0) + '</div></div><div class="card"><div class="label">策略数量</div><div class="value">' + escapeHTML(state.policies.length) + '</div></div><div class="card"><div class="label">审计开启</div><div class="value">' + escapeHTML(enabledPolicies) + '</div></div><div class="card"><div class="label">含禁止模型</div><div class="value">' + escapeHTML(deniedPolicies) + '</div></div></section>' +
          (state.tab === 'audit' ? renderAudit() : state.tab === 'policies' ? renderPolicies() : renderSettings()) +
          '</div>';
        bindEvents();
      };
      const renderAudit = () => '<section class="panel"><div class="panel-head"><h2>请求审计</h2><span class="muted">第 ' + escapeHTML(state.pagination.page || 1) + ' 页，共 ' + escapeHTML(state.pagination.total || 0) + ' 条</span></div><div class="filters">' +
        field('key_hash','Key Hash',state.filters.key_hash,'输入完整或部分 Key Hash') + field('model','模型',state.filters.model,'模型名称') + field('source_format','来源',state.filters.source_format,'例如 openai') + field('outcome','结果',state.filters.outcome,'allow / deny / error') + field('security_signal','安全信号',state.filters.security_signal,'过滤安全信号') + '<div class="field"><label>&nbsp;</label><button class="primary" data-action="filter">应用筛选</button></div></div>' +
        '<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>Key Hash</th><th>模型</th><th>来源</th><th>结果</th><th>状态</th><th>安全信号</th><th></th></tr></thead><tbody>' + (state.records.length ? state.records.map((record) => '<tr><td>' + escapeHTML(formatTimestamp(record.created_at)) + '</td><td class="mono">' + escapeHTML(maskHash(record.key_hash)) + '</td><td>' + escapeHTML(record.model || '-') + '</td><td>' + escapeHTML(record.source_format || '-') + '</td><td>' + outcomeBadge(record.outcome) + '</td><td>' + escapeHTML(record.status_code || '-') + '</td><td>' + escapeHTML(record.security_signal || '-') + '</td><td><button class="small" data-action="detail" data-id="' + escapeHTML(record.id) + '">详情</button></td></tr>').join('') : '<tr><td colspan="8" class="empty">暂无审计记录</td></tr>') + '</tbody></table></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="small" data-action="prev" ' + ((state.pagination.page || 1) <= 1 ? 'disabled' : '') + '>上一页</button><button class="small" data-action="next" ' + (!state.pagination.has_next ? 'disabled' : '') + '>下一页</button></div></section>' + (state.detail ? '<section class="panel"><div class="panel-head"><h2>记录详情 #' + escapeHTML(state.detail.id) + '</h2><button class="small" data-action="close-detail">关闭</button></div><div class="split"><div><div class="field"><label>请求文本</label><div class="detail message-markdown">' + renderMarkdown(state.detail.text || (state.detail.text_available === false ? '文本不可用：' + (state.detail.text_unavailable_reason || '未知原因') : '')) + '</div></div></div><div><p><strong>Key Hash：</strong><span class="mono">' + escapeHTML(maskHash(state.detail.key_hash)) + '</span></p><p><strong>请求 ID：</strong>' + escapeHTML(state.detail.request_id || '-') + '</p><p><strong>安全消息：</strong>' + escapeHTML(state.detail.security_message || '-') + '</p><p><strong>截断：</strong>' + (state.detail.text_truncated ? '是' : '否') + '</p></div></div></section>' : '');
      const field = (name,label,value,placeholder) => '<div class="field"><label>' + label + '</label><input data-filter="' + name + '" value="' + escapeHTML(value || '') + '" placeholder="' + escapeHTML(placeholder || '') + '"></div>';
      const outcomeBadge = (value) => { const text = String(value || 'unknown'); const klass = text === 'allow' ? 'success' : (text === 'deny' ? 'danger' : 'warn'); return '<span class="badge ' + klass + '">' + escapeHTML(text) + '</span>'; };
      const renderPolicies = () => '<section class="panel"><div class="panel-head"><h2>访问策略</h2><button class="small" data-action="refresh-policies">刷新</button></div><p class="muted">插件只暴露 Key Hash，不会在派生数据或页面中显示明文 API Key。禁止模型使用逗号分隔。</p><div class="table-wrap"><table class="table"><thead><tr><th>Key Hash</th><th>禁止模型</th><th>审计</th><th>更新时间</th><th></th></tr></thead><tbody>' + (state.policies.length ? state.policies.map((policy) => '<tr><td class="mono">' + escapeHTML(maskHash(policy.key_hash)) + '</td><td><input class="policy-input" id="models-' + escapeHTML(policy.key_hash) + '" value="' + escapeHTML((policy.denied_models || []).join(', ')) + '"></td><td><label class="check"><input id="audit-' + escapeHTML(policy.key_hash) + '" type="checkbox" ' + (policy.audit_enabled !== false ? 'checked' : '') + '>开启</label></td><td>' + escapeHTML(policy.updated_at || '-') + '</td><td><button class="small primary" data-action="save-policy" data-hash="' + escapeHTML(policy.key_hash) + '">保存</button></td></tr>').join('') : '<tr><td colspan="5" class="empty">暂无显式策略。缺省策略由插件设置决定。</td></tr>') + '</tbody></table></div></section>';
      const renderSettings = () => { const settings = state.settings || {}; return '<section class="panel"><div class="panel-head"><h2>插件设置</h2></div><div class="filters" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="field"><label>保留天数</label><input id="retention" type="number" min="1" max="3650" value="' + escapeHTML(settings.retention_days || '') + '"></div><div class="field"><label>最大文本字节数</label><input id="max-text" type="number" min="1" value="' + escapeHTML(settings.max_text_bytes || '') + '"></div><div class="field"><label>缺省审计</label><label class="check"><input id="default-audit" type="checkbox" ' + (settings.default_audit_enabled !== false ? 'checked' : '') + '>开启</label></div></div><button class="primary" data-action="save-settings">保存设置</button><p class="footer-note">修改保留天数会同时触发过期数据清理。插件配置仍由通用插件中心管理。</p></section>'; };
      const bindEvents = () => {
        document.querySelectorAll('[data-tab]').forEach((node) => node.addEventListener('click', () => { state.tab = node.dataset.tab; render(); }));
        document.querySelectorAll('[data-filter]').forEach((node) => node.addEventListener('input', () => { state.filters[node.dataset.filter] = node.value; }));
        document.querySelectorAll('[data-action]').forEach((node) => node.addEventListener('click', () => {
          const action = node.dataset.action;
          if (action === 'reload') return load();
          if (action === 'filter') return refreshAudit(1);
          if (action === 'prev') return refreshAudit(Math.max(1, (state.pagination.page || 1) - 1));
          if (action === 'next') return refreshAudit((state.pagination.page || 1) + 1);
          if (action === 'detail') return detail(node.dataset.id);
          if (action === 'close-detail') { state.detail = null; render(); return; }
          if (action === 'refresh-policies') return refreshPolicies();
          if (action === 'save-policy') return savePolicy(node.dataset.hash);
          if (action === 'save-settings') return saveSettings();
        }));
      };
      load();
    })();
  </script>
</body>
</html>
