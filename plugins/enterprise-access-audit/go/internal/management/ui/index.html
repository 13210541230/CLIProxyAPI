  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--muted:#64748b;--text:#172033;--brand:#2563eb;--brand-soft:#eff6ff;--danger:#dc2626;--success:#15803d;--warn:#b45309;--shadow:0 12px 30px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:8px 12px}button:hover{border-color:#93c5fd;background:#f8fbff}button:disabled{cursor:not-allowed;opacity:.55}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.danger{color:var(--danger)}button.small{padding:5px 9px;font-size:12px}.shell{max-width:1440px;margin:0 auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:12px;color:var(--brand);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:4px 0 4px;font-size:26px}.hero p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted)}.tab.active{color:var(--brand);background:var(--brand-soft);font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:16px}.card .label{color:var(--muted);font-size:12px}.card .value{font-size:25px;font-weight:750;margin-top:4px}.panel{padding:18px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2{font-size:16px;margin:0}.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;color:var(--text)}input:focus,select:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}.table th{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap}.table tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:12px;background:#f1f5f9;color:#475569}.badge.success{background:#ecfdf5;color:var(--success)}.badge.warn{background:#fffbeb;color:var(--warn)}.badge.danger{background:#fef2f2;color:var(--danger)}.muted{color:var(--muted)}.empty,.loading,.error{padding:32px;text-align:center;color:var(--muted)}.error{color:var(--danger);background:#fff1f2;border-radius:10px}.detail{word-break:break-word;background:#f8fafc;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:16px;max-height:520px;overflow:auto}.message-markdown{font-size:14px;line-height:1.75}.message-markdown p{margin:0 0 12px}.message-markdown p:last-child{margin-bottom:0}.message-markdown h1,.message-markdown h2,.message-markdown h3{margin:0 0 10px;line-height:1.3}.message-markdown h1{font-size:20px}.message-markdown h2{font-size:18px}.message-markdown h3{font-size:16px}.message-markdown ul{margin:0 0 12px;padding-left:22px}.message-markdown li{margin:4px 0}.message-markdown blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid #93c5fd;background:#eff6ff;color:#475569}.message-markdown pre{margin:0 0 12px;padding:12px;overflow:auto;border-radius:8px;background:#0f172a;color:#e2e8f0;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.message-markdown code{padding:2px 5px;border-radius:4px;background:#e2e8f0;color:#334155;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.message-markdown pre code{padding:0;background:transparent;color:inherit}.message-markdown a{color:var(--brand);text-decoration:underline}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);display:none;z-index:10}.toast.show{display:block}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.7fr);gap:18px}.footer-note{color:var(--muted);font-size:12px;margin-top:12px}.policy-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.policy-toolbar .actions{align-items:center}.selection-count{color:var(--muted);font-size:13px}.policy-summary{display:flex;flex-direction:column;gap:3px;min-width:190px}.policy-models{max-width:360px;word-break:break-word}.model-picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.model-status{padding:8px 10px;border-radius:8px;background:#f8fafc;color:var(--muted);font-size:12px}.model-status.error{padding:8px 10px;text-align:left}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:32px}.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 8px;border-radius:999px;background:var(--brand-soft);color:#1d4ed8;font-size:12px}.chip button{padding:0;border:0;background:transparent;color:inherit;font-size:16px;line-height:1}.policy-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.42);z-index:5}.policy-dialog{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border-radius:14px;box-shadow:0 24px 70px rgba(15,23,42,.25);padding:20px}.policy-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.policy-dialog h2{margin:0;font-size:18px}.policy-dialog-section{padding:14px 0;border-top:1px solid var(--line)}.policy-dialog-section:first-of-type{border-top:0;padding-top:0}.policy-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.policy-dialog select{min-height:42px}.policy-dialog .model-search{margin-bottom:8px}.policy-dialog .hint{margin:6px 0 0;color:var(--muted);font-size:12px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.user-cell{min-width:180px}.user-cell strong{display:block}.user-cell small{display:block;color:var(--muted);margin-top:2px}.checkbox-cell{width:42px}.loading-inline{color:var(--muted);font-size:12px}@media(max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.shell{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.hero{flex-direction:column}.model-picker{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.hero h1{font-size:22px}.policy-dialog{padding:16px}}
  </style>
</head>
<body>
  <main id="app"><div class="loading">正在连接插件管理接口…</div></main>
  <div id="toast" class="toast"></div>
  <script>
    (() => {
      'use strict';
      const API = '/v0/management/enterprise-access-audit';
      const hostOrigin = (() => {
        try {
          const explicit = new URLSearchParams(window.location.search).get('cpa_plugin_host_origin');
          if (explicit && new URL(explicit).origin === explicit) return explicit;
          return document.referrer ? new URL(document.referrer).origin : '*';
        } catch (_) { return '*'; }
      })();
      const pending = new Map();
      const staticModelChannels = ['claude','gemini','gemini-interactions','vertex','aistudio','codex','kimi','antigravity','xai'];
      let sequence = 0;
      const state = {
        tab:'audit', records:[], policies:[], settings:null, keyMetadata:[], metadataError:'',
        models:[], modelLoading:false, modelError:'',
        pagination:{page:1,page_size:25,total:0,has_next:false},
        filters:{user_name:'',key_hash:'',model:'',source_format:'',outcome:'',security_signal:''},
        policySearch:'', selectedGroups:new Set(), policyEditor:null, detail:null, loading:false
      };
      let refreshTimer = 0;
      let auditRefreshBusy = false;
      const $ = (selector) => document.querySelector(selector);
      const escapeHTML = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const renderInline = (value) => {
        const codeTokens = [];
        let text = escapeHTML(value);
        text = text.replace(/`([^`\n]+)`/g, (_, code) => { const token = '\u0000code' + codeTokens.length + '\u0000'; codeTokens.push('<code>' + code + '</code>'); return token; });
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => '<a href="' + url + '" target="_blank" rel="noreferrer noopener">' + label + '</a>');
        text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
        text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
        text = text.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
        return text.replace(/\u0000code(\d+)\u0000/g, (_, index) => codeTokens[Number(index)] || '');
      };
      const renderMarkdown = (value) => {
        const lines = String(value == null ? '' : value).replace(/\r\n/g, '\n').split('\n');
        let html = ''; let paragraph = []; let listOpen = false; let codeOpen = false; let codeLines = [];
        const flushParagraph = () => { if (paragraph.length) { html += '<p>' + paragraph.map(renderInline).join('<br>') + '</p>'; paragraph = []; } };
        const closeList = () => { if (listOpen) { html += '</ul>'; listOpen = false; } };
        const closeCode = () => { if (codeOpen) { html += '<pre><code>' + escapeHTML(codeLines.join('\n')) + '</code></pre>'; codeLines = []; codeOpen = false; } };
        lines.forEach((line) => {
          if (codeOpen) { if (/^```\s*$/.test(line)) closeCode(); else codeLines.push(line); return; }
          if (/^```/.test(line)) { flushParagraph(); closeList(); codeOpen = true; return; }
          if (!line.trim()) { flushParagraph(); closeList(); return; }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { flushParagraph(); closeList(); const level = heading[1].length; html += '<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>'; return; }
          const listItem = line.match(/^\s*[-*+]\s+(.+)$/);
          if (listItem) { flushParagraph(); if (!listOpen) { html += '<ul>'; listOpen = true; } html += '<li>' + renderInline(listItem[1]) + '</li>'; return; }
          if (listOpen) closeList();
          const quote = line.match(/^\s*>\s?(.*)$/);
          if (quote) { flushParagraph(); html += '<blockquote>' + renderInline(quote[1]) + '</blockquote>'; return; }
          paragraph.push(line);
        });
        flushParagraph(); closeList(); closeCode();
        return html || '<p class="muted">文本为空</p>';
      };
      const normalizeModel = (value) => String(value == null ? '' : value).trim().toLowerCase();
      const normalizeModels = (values) => Array.from(new Set((Array.isArray(values) ? values : [values]).map(normalizeModel).filter(Boolean))).sort((left, right) => left.localeCompare(right));
      const normalizeKeyHash = (value) => String(value || '').trim().toLowerCase();
      const shortHash = (value) => normalizeKeyHash(value).slice(0, 8);
      const maskHash = (value) => { const text = normalizeKeyHash(value); return text.length > 12 ? text.slice(0,8) + '…' + text.slice(-4) : text || '-'; };
      const metadataForHash = (value) => {
        const hash = shortHash(value);
        if (!hash) return [];
        return state.keyMetadata.filter((item) => shortHash(item && item.apiKeyHash) === hash);
      };
      const metadataForUserQuery = (value) => {
        const query = String(value || '').trim().toLocaleLowerCase();
        if (!query) return state.keyMetadata;
        return state.keyMetadata.filter((item) => {
          const userName = String(item && item.userName || '').trim().toLocaleLowerCase();
          const email = String(item && item.email || '').trim().toLocaleLowerCase();
          return userName.includes(query) || email.includes(query);
        });
      };
      const userLabelForHash = (value) => {
        const matches = metadataForHash(value);
        const names = Array.from(new Set(matches.map((item) => String(item && item.userName || '').trim()).filter(Boolean)));
        if (names.length === 1) return names[0];
        if (names.length > 1) return '多个用户（Hash 前缀重复）';
        return '未关联用户';
      };
      const monitoringHashForRecord = (value) => {
        const matches = metadataForHash(value);
        if (matches.length === 1) {
          const fullHash = normalizeKeyHash(matches[0].apiKeyHash);
          return fullHash.slice(-8) || maskHash(value);
        }
        return maskHash(value);
      };
      const metadataIdentity = (item) => {
        const userName = String(item && item.userName || '').trim();
        const email = String(item && item.email || '').trim();
        const department = String(item && (item.departmentId || item.department) || '').trim();
        return [userName || '未关联用户', email, department].join('\u0000');
      };
      const policyForHash = (hash) => state.policies.find((item) => shortHash(item && item.key_hash) === shortHash(hash));
      const effectiveAuditForHash = (hash) => {
        const policy = policyForHash(hash);
        return policy ? policy.audit_enabled !== false : state.settings?.default_audit_enabled !== false;
      };
      const buildPolicyGroups = () => {
        const groups = new Map();
        state.keyMetadata.forEach((item) => {
          const hash = shortHash(item && item.apiKeyHash);
          if (!hash) return;
          const id = metadataIdentity(item);
          if (!groups.has(id)) {
            groups.set(id, {id, userName:String(item.userName || '').trim() || '未关联用户', email:String(item.email || '').trim(), department:String(item.departmentId || item.department || '').trim(), hashes:[]});
          }
          const group = groups.get(id);
          if (!group.hashes.includes(hash)) group.hashes.push(hash);
        });
        state.policies.forEach((policy) => {
          const hash = shortHash(policy && policy.key_hash);
          if (!hash || Array.from(groups.values()).some((group) => group.hashes.includes(hash))) return;
          groups.set('hash\u0000' + hash, {id:'hash\u0000' + hash, userName:userLabelForHash(hash), email:'', department:'', hashes:[hash]});
        });
        return Array.from(groups.values()).sort((left, right) => left.userName.localeCompare(right.userName));
      };
      const filteredPolicyGroups = () => {
        const query = state.policySearch.trim().toLocaleLowerCase();
        if (!query) return buildPolicyGroups();
        return buildPolicyGroups().filter((group) => [group.userName, group.email, group.department].some((value) => String(value || '').toLocaleLowerCase().includes(query)));
      };
      const userSearchValues = () => Array.from(new Set(state.keyMetadata.flatMap((item) => [String(item && item.userName || '').trim(), String(item && item.email || '').trim()]).filter(Boolean))).sort((left, right) => left.localeCompare(right));
      const userSearchDatalist = (id) => '<datalist id="' + id + '">' + userSearchValues().map((value) => '<option value="' + escapeHTML(value) + '"></option>').join('') + '</datalist>';
      const hashesForUserQuery = () => Array.from(new Set(metadataForUserQuery(state.filters.user_name).map((item) => shortHash(item && item.apiKeyHash)).filter((value) => value.length === 8)));
      const formatTimestamp = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? String(value || '-') : date.toLocaleString(undefined, {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}); };
      const showToast = (message) => { const node = $('#toast'); node.textContent = message; node.classList.add('show'); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => node.classList.remove('show'), 2600); };
      const callHost = (method, path, body) => new Promise((resolve, reject) => {
        const id = 'audit-' + (++sequence);
        const timer = window.setTimeout(() => { pending.delete(id); reject(new Error('管理接口请求超时')); }, 15000);
        pending.set(id, {resolve, reject, timer});
        window.parent.postMessage({type:'cpa-plugin-api-request', id, method, path, body}, hostOrigin);
      });
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent || (hostOrigin !== '*' && event.origin !== hostOrigin) || !event.data || event.data.type !== 'cpa-plugin-api-response') return;
        const item = pending.get(String(event.data.id || ''));
        if (!item) return;
        pending.delete(String(event.data.id)); window.clearTimeout(item.timer);
        if (event.data.ok) item.resolve(event.data.data); else item.reject(new Error(event.data.error || ('管理接口请求失败（HTTP ' + (event.data.status || 0) + '）')));
      });
      const queryString = (values) => Object.entries(values).flatMap(([key, value]) => {
        const items = Array.isArray(value) ? value : [value];
        return items.filter((item) => String(item || '').trim()).map((item) => encodeURIComponent(key) + '=' + encodeURIComponent(item));
      }).join('&');
      const loadKeyMetadata = async () => {
        try {
          const payload = await callHost('GET', '/v0/management/enterprise/key-bindings/metadata');
          state.keyMetadata = Array.isArray(payload && payload.items) ? payload.items : [];
          state.metadataError = '';
        } catch (error) {
          state.keyMetadata = []; state.metadataError = error && error.message ? error.message : '企业 Key 用户信息暂不可用';
        }
      };
      const modelNamesFromPayload = (payload) => {
        const entries = Array.isArray(payload) ? payload : Array.isArray(payload && payload.models) ? payload.models : Array.isArray(payload && payload.data) ? payload.data : [];
        return entries.map((entry) => {
          if (typeof entry === 'string') return normalizeModel(entry);
          if (!entry || typeof entry !== 'object') return '';
          return normalizeModel(entry.id || entry.name || entry.model || entry.value);
        }).filter(Boolean);
      };
      const loadSupportedModels = async () => {
        state.modelLoading = true; state.modelError = '';
        const names = new Set();
        try {
          const authPayload = await callHost('GET', '/v0/management/auth-files');
          const files = Array.isArray(authPayload && authPayload.files) ? authPayload.files : [];
          const usableFiles = files.filter((file) => file && file.id && file.disabled !== true && file.unavailable !== true && String(file.status || '').toLowerCase() !== 'disabled');
          const authResults = await Promise.allSettled(usableFiles.map((file) => callHost('GET', '/v0/management/auth-files/models?name=' + encodeURIComponent(String(file.id)))));
          authResults.forEach((result) => { if (result.status === 'fulfilled') modelNamesFromPayload(result.value).forEach((name) => names.add(name)); });
        } catch (_) {
          /* Static definitions below remain available when auth-file discovery is unavailable. */
        }
        const definitionResults = await Promise.allSettled(staticModelChannels.map((channel) => callHost('GET', '/v0/management/model-definitions/' + channel)));
        definitionResults.forEach((result) => { if (result.status === 'fulfilled') modelNamesFromPayload(result.value).forEach((name) => names.add(name)); });
        state.policies.forEach((policy) => (policy.denied_models || []).forEach((name) => names.add(normalizeModel(name))));
        state.models = Array.from(names).filter(Boolean).sort((left, right) => left.localeCompare(right));
        state.modelLoading = false;
        if (!state.models.length) state.modelError = '暂未读取到模型目录，仍可手动输入模型 ID';
      };
      const loadAudit = async (page) => {
        const selectedUser = String(state.filters.user_name || '').trim();
        const values = Object.assign({}, state.filters, {page:page || 1, page_size:state.pagination.page_size || 25});
        delete values.user_name;
        if (selectedUser) {
          const hashes = hashesForUserQuery();
          if (!hashes.length) return {records:[], pagination:{page:page || 1, page_size:state.pagination.page_size || 25, total:0, has_next:false}};
          values.key_hash = hashes;
        }
        return callHost('GET', API + '/audit?' + queryString(values));
      };
      const applyAudit = (payload) => { state.records = Array.isArray(payload && payload.records) ? payload.records : []; state.pagination = (payload && payload.pagination) || {page:1,page_size:25,total:0,has_next:false}; };
      const refreshAudit = async (page) => { if (auditRefreshBusy) return; auditRefreshBusy = true; try { applyAudit(await loadAudit(page || state.pagination.page || 1)); state.detail = null; render(); } catch (error) { showToast(error.message || '审计记录加载失败'); } finally { auditRefreshBusy = false; } };
      const refreshLatestAudit = async () => { if (auditRefreshBusy || state.loading || document.visibilityState === 'hidden') return; auditRefreshBusy = true; try { applyAudit(await loadAudit(state.pagination.page || 1)); render(); } catch (_) {} finally { auditRefreshBusy = false; } };
      const startAutoRefresh = () => { if (refreshTimer) return; refreshTimer = window.setInterval(() => { void refreshLatestAudit(); }, 10000); };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') void refreshLatestAudit(); });
      const refreshPolicies = async () => { try { const payload = await callHost('GET', API + '/policies'); state.policies = Array.isArray(payload && payload.policies) ? payload.policies : []; await loadSupportedModels(); render(); } catch (error) { showToast(error.message || '策略加载失败'); } };
      const policyAggregate = (group) => {
        const modelLists = group.hashes.map((hash) => normalizeModels(policyForHash(hash)?.denied_models || []));
        const firstModels = JSON.stringify(modelLists[0] || []);
        const modelsMixed = modelLists.some((models) => JSON.stringify(models) !== firstModels);
        const audits = group.hashes.map(effectiveAuditForHash);
        const auditValue = audits.length && audits.every((value) => value === audits[0]) ? audits[0] : null;
        return {deniedModels:modelsMixed ? [] : (modelLists[0] || []), modelsMixed, auditEnabled:auditValue};
      };
      const openPolicyEditor = (group, mode) => {
        const aggregate = policyAggregate(group);
        state.policyEditor = {mode, group, deniedModels:aggregate.deniedModels.slice(), modelsMixed:aggregate.modelsMixed, modelsChanged:false, auditEnabled:aggregate.auditEnabled === null ? true : aggregate.auditEnabled, auditChoice:aggregate.auditEnabled === null ? 'unchanged' : aggregate.auditEnabled ? 'enabled' : 'disabled', modelSearch:''};
        render();
      };
      const closePolicyEditor = () => { if (!state.policyEditor?.saving) { state.policyEditor = null; render(); } };
      const savePolicyEditor = async () => {
        const editor = state.policyEditor;
        if (!editor || editor.saving) return;
        const hashes = editor.group.hashes.slice();
        if (!hashes.length) return;
        const deniedModels = normalizeModels(editor.deniedModels);
        const modelsChanged = editor.modelsChanged || (!editor.modelsMixed && JSON.stringify(deniedModels) !== JSON.stringify(normalizeModels(editor.group.hashes.length ? policyForHash(editor.group.hashes[0])?.denied_models || [] : [])));
        const auditChanged = editor.mode === 'batch' ? editor.auditChoice !== 'unchanged' : editor.auditEnabled !== effectiveAuditForHash(hashes[0]);
        if (!modelsChanged && !auditChanged) { closePolicyEditor(); return; }
        editor.saving = true; render();
        try {
          const auditValue = editor.mode === 'batch' ? (editor.auditChoice === 'enabled' ? true : editor.auditChoice === 'disabled' ? false : null) : editor.auditEnabled;
          if (modelsChanged) {
            await callHost('PUT', API + '/policies/batch', {key_hashes:hashes, denied_models:deniedModels, audit_enabled:auditValue});
          } else if (auditValue !== null) {
            await Promise.all(hashes.map((hash) => callHost('PUT', API + '/policy', {key_hash:hash, audit_enabled:auditValue})));
          }
          state.policyEditor = null; state.selectedGroups.clear(); showToast('策略已保存');
          await refreshPolicies();
        } catch (error) {
          editor.saving = false; render(); showToast(error.message || '策略保存失败');
        }
      };
      const addEditorModel = (value) => {
        const model = normalizeModel(value);
        if (!model || !state.policyEditor) return;
        state.policyEditor.deniedModels = normalizeModels(state.policyEditor.deniedModels.concat(model));
        state.policyEditor.modelsChanged = true; render();
      };
      const removeEditorModel = (model) => {
        if (!state.policyEditor) return;
        state.policyEditor.deniedModels = state.policyEditor.deniedModels.filter((item) => item !== normalizeModel(model));
        state.policyEditor.modelsChanged = true; render();
      };
      const detail = async (id) => { try { state.detail = await callHost('GET', API + '/audit/detail?id=' + encodeURIComponent(id)); render(); } catch (error) { showToast(error.message || '详情加载失败'); } };
      const renderError = (message) => { $('#app').innerHTML = '<div class="shell"><div class="error"><strong>Enterprise Access Audit 暂不可用</strong><div>' + escapeHTML(message) + '</div><button class="small" data-action="reload" style="margin-top:12px">重新加载</button></div></div>'; bindEvents(); };
      const render = () => {
        if (state.loading) { $('#app').innerHTML = '<div class="shell"><div class="loading">正在加载插件数据…</div></div>'; return; }
        const enabledPolicies = state.policies.filter((item) => item.audit_enabled !== false).length;
        const deniedPolicies = state.policies.filter((item) => item.denied_models && item.denied_models.length).length;
        $('#app').innerHTML = '<div class="shell"><header class="hero"><div><div class="eyebrow">Plugin workspace</div><h1>Enterprise Access Audit</h1><p>插件自主管理访问策略、审计记录和数据保留设置，用户名支持直接搜索，模型策略可从当前 CPA 模型目录选择。</p></div><div class="actions"><button class="small" data-action="reload">刷新</button></div></header><nav class="tabs"><button class="tab ' + (state.tab === 'audit' ? 'active' : '') + '" data-tab="audit">审计记录</button><button class="tab ' + (state.tab === 'policies' ? 'active' : '') + '" data-tab="policies">访问策略</button><button class="tab ' + (state.tab === 'settings' ? 'active' : '') + '" data-tab="settings">插件设置</button></nav><section class="cards"><div class="card"><div class="label">审计记录</div><div class="value">' + escapeHTML(state.pagination.total || 0) + '</div></div><div class="card"><div class="label">策略数量</div><div class="value">' + escapeHTML(state.policies.length) + '</div></div><div class="card"><div class="label">审计开启</div><div class="value">' + escapeHTML(enabledPolicies) + '</div></div><div class="card"><div class="label">含禁止模型</div><div class="value">' + escapeHTML(deniedPolicies) + '</div></div></section>' + (state.tab === 'audit' ? renderAudit() : state.tab === 'policies' ? renderPolicies() : renderSettings()) + (state.policyEditor ? renderPolicyEditor() : '') + '</div>';
        bindEvents();
      };
      const userField = () => '<div class="field"><label>用户名搜索</label><input list="audit-user-options" data-filter="user_name" value="' + escapeHTML(state.filters.user_name || '') + '" placeholder="输入或选择用户名、邮箱"><span class="loading-inline">可输入关键字，也可从下拉建议中选择</span></div>' + userSearchDatalist('audit-user-options');
      const field = (name,label,value,placeholder) => '<div class="field"><label>' + label + '</label><input data-filter="' + name + '" value="' + escapeHTML(value || '') + '" placeholder="' + escapeHTML(placeholder || '') + '"></div>';
      const outcomeBadge = (value) => { const text = String(value || 'unknown'); const klass = text === 'allow' ? 'success' : (text === 'deny' ? 'danger' : 'warn'); return '<span class="badge ' + klass + '">' + escapeHTML(text) + '</span>'; };
      const renderAudit = () => '<section class="panel"><div class="panel-head"><h2>请求审计</h2><span class="muted">第 ' + escapeHTML(state.pagination.page || 1) + ' 页，共 ' + escapeHTML(state.pagination.total || 0) + ' 条</span></div><p class="muted">用户名搜索支持关键字匹配；一个用户拥有多个 Enterprise Key 时会合并查询。内部仍使用 CPA 的 8 位 Key Hash，右侧 Hash 尾码与请求监控保持一致。</p>' + (state.metadataError ? '<p class="muted">用户信息暂不可用，当前无法按用户名匹配：' + escapeHTML(state.metadataError) + '</p>' : '') + '<div class="filters">' + userField() + field('key_hash','Key Hash（兼容）',state.filters.key_hash,'输入 8 位内部 Hash') + field('model','模型',state.filters.model,'模型名称') + field('source_format','来源',state.filters.source_format,'例如 openai') + field('outcome','结果',state.filters.outcome,'allow / deny / error') + field('security_signal','安全信号',state.filters.security_signal,'过滤安全信号') + '<div class="field"><label>&nbsp;</label><button class="primary" data-action="filter">应用筛选</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户</th><th>Hash 尾码</th><th>模型</th><th>来源</th><th>结果</th><th>状态</th><th>安全信号</th><th></th></tr></thead><tbody>' + (state.records.length ? state.records.map((record) => '<tr><td>' + escapeHTML(formatTimestamp(record.created_at)) + '</td><td><strong>' + escapeHTML(userLabelForHash(record.key_hash)) + '</strong></td><td class="mono">' + escapeHTML(monitoringHashForRecord(record.key_hash)) + '</td><td>' + escapeHTML(record.model || '-') + '</td><td>' + escapeHTML(record.source_format || '-') + '</td><td>' + outcomeBadge(record.outcome) + '</td><td>' + escapeHTML(record.status_code || '-') + '</td><td>' + escapeHTML(record.security_signal || '-') + '</td><td><button class="small" data-action="detail" data-id="' + escapeHTML(record.id) + '">详情</button></td></tr>').join('') : '<tr><td colspan="9" class="empty">暂无审计记录</td></tr>') + '</tbody></table></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="small" data-action="prev" ' + ((state.pagination.page || 1) <= 1 ? 'disabled' : '') + '>上一页</button><button class="small" data-action="next" ' + (!state.pagination.has_next ? 'disabled' : '') + '>下一页</button></div></section>' + (state.detail ? '<section class="panel"><div class="panel-head"><h2>记录详情 #' + escapeHTML(state.detail.id) + '</h2><button class="small" data-action="close-detail">关闭</button></div><div class="split"><div><div class="field"><label>请求文本</label><div class="detail message-markdown">' + renderMarkdown(state.detail.text || (state.detail.text_available === false ? '文本不可用：' + (state.detail.text_unavailable_reason || '未知原因') : '')) + '</div></div></div><div><p><strong>用户：</strong>' + escapeHTML(userLabelForHash(state.detail.key_hash)) + '</p><p><strong>Hash 尾码：</strong><span class="mono">' + escapeHTML(monitoringHashForRecord(state.detail.key_hash)) + '</span></p><p><strong>请求 ID：</strong>' + escapeHTML(state.detail.request_id || '-') + '</p><p><strong>安全消息：</strong>' + escapeHTML(state.detail.security_message || '-') + '</p><p><strong>截断：</strong>' + (state.detail.text_truncated ? '是' : '否') + '</p></div></div></section>' : '');
      const renderPolicies = () => {
        const groups = filteredPolicyGroups();
        const selectedCount = groups.filter((group) => state.selectedGroups.has(group.id)).length;
        const allSelected = groups.length > 0 && groups.every((group) => state.selectedGroups.has(group.id));
        return '<section class="panel"><div class="panel-head"><div><h2>访问策略</h2><span class="muted">按用户名分组，一个用户的多个 Key 可一次性设置</span></div><button class="small" data-action="refresh-policies">刷新</button></div><div class="policy-toolbar"><div class="actions"><input list="policy-user-options" data-policy-search value="' + escapeHTML(state.policySearch) + '" placeholder="输入或选择用户名、邮箱、部门" style="min-width:280px">' + userSearchDatalist('policy-user-options') + '<span class="selection-count">已选择 ' + selectedCount + ' 个用户</span></div><div class="actions"><button class="primary" data-action="batch-policy" ' + (selectedCount ? '' : 'disabled') + '>批量设置限制策略</button></div></div><p class="muted">模型下拉列表来自当前 CPA 模型目录；也可手动输入未列出的动态模型。保存模型限制会覆盖选中用户的现有禁止列表，单独修改审计开关不会清空原有模型限制。</p>' + (state.modelLoading ? '<div class="model-status">正在读取当前支持的模型…</div>' : state.modelError ? '<div class="model-status error">' + escapeHTML(state.modelError) + '</div>' : '<div class="model-status">当前可选模型：' + escapeHTML(state.models.length) + ' 个</div>') + '<div class="table-wrap"><table class="table"><thead><tr><th class="checkbox-cell"><input type="checkbox" data-action="toggle-all-groups" ' + (allSelected ? 'checked' : '') + ' aria-label="全选用户"></th><th>用户</th><th>Key 数</th><th>Hash 尾码</th><th>禁止模型</th><th>审计</th><th>更新时间</th><th></th></tr></thead><tbody>' + (groups.length ? groups.map((group, index) => renderPolicyGroup(group, index)).join('') : '<tr><td colspan="8" class="empty">暂无用户或显式策略</td></tr>') + '</tbody></table></div></section>';
      };
      const renderPolicyGroup = (group, index) => {
        const aggregate = policyAggregate(group);
        const policies = group.hashes.map(policyForHash).filter(Boolean);
        const timestamps = policies.map((policy) => policy.updated_at).filter(Boolean).sort();
        const modelsText = aggregate.modelsMixed ? '多个 Key 的限制不同' : aggregate.deniedModels.length ? aggregate.deniedModels.join(', ') : '不限制模型';
        const auditText = aggregate.auditEnabled === null ? '状态不同' : aggregate.auditEnabled ? '开启' : '关闭';
        const tailHashes = group.hashes.map((hash) => { const matches = metadataForHash(hash); return matches.length === 1 ? normalizeKeyHash(matches[0].apiKeyHash).slice(-8) : maskHash(hash); });
        return '<tr><td class="checkbox-cell"><input type="checkbox" data-group-index="' + index + '" ' + (state.selectedGroups.has(group.id) ? 'checked' : '') + ' aria-label="选择 ' + escapeHTML(group.userName) + '"></td><td class="user-cell"><strong>' + escapeHTML(group.userName) + '</strong>' + (group.email ? '<small>' + escapeHTML(group.email) + '</small>' : '') + (group.department ? '<small>' + escapeHTML(group.department) + '</small>' : '') + '</td><td>' + escapeHTML(group.hashes.length) + '</td><td class="mono">' + escapeHTML(tailHashes.join(', ')) + '</td><td class="policy-models">' + escapeHTML(modelsText) + '</td><td>' + escapeHTML(auditText) + '</td><td>' + escapeHTML(timestamps.length ? timestamps[timestamps.length - 1] : '继承默认') + '</td><td><button class="small" data-action="edit-group" data-group-index="' + index + '">编辑</button></td></tr>';
      };
      const renderPolicyEditor = () => {
        const editor = state.policyEditor;
        const options = state.models.concat(editor.deniedModels.filter((model) => !state.models.includes(model))).filter((model, index, list) => list.indexOf(model) === index);
        const modelOptions = options.map((model) => '<option value="' + escapeHTML(model) + '"></option>').join('');
        const chips = editor.deniedModels.length ? editor.deniedModels.map((model) => '<span class="chip">' + escapeHTML(model) + '<button type="button" data-action="remove-editor-model" data-model="' + escapeHTML(model) + '" aria-label="移除 ' + escapeHTML(model) + '">×</button></span>').join('') : '<span class="muted">当前不禁止任何模型</span>';
        const target = editor.mode === 'batch' ? '已选择 ' + editor.group.hashes.length + ' 个 Key / 用户策略' : editor.group.userName + '（' + editor.group.hashes.length + ' 个 Key）';
        const modelHint = editor.modelsMixed ? '<p class="hint">选中用户当前存在不同的禁止模型列表，未预填任何模型；只有明确添加或清空后才会统一覆盖。</p>' : '<p class="hint">选择模型后会加入禁止列表；保存时按精确模型 ID 匹配。</p>';
        const auditControl = editor.mode === 'batch' ? '<div class="field"><label>用户文本审计</label><select data-editor-audit><option value="unchanged" ' + (editor.auditChoice === 'unchanged' ? 'selected' : '') + '>不修改</option><option value="enabled" ' + (editor.auditChoice === 'enabled' ? 'selected' : '') + '>全部启用</option><option value="disabled" ' + (editor.auditChoice === 'disabled' ? 'selected' : '') + '>全部停用</option></select></div>' : '<label class="check"><input type="checkbox" data-editor-audit ' + (editor.auditEnabled ? 'checked' : '') + '>启用用户文本审计</label>';
        return '<div class="policy-modal"><div class="policy-dialog" role="dialog" aria-modal="true" aria-labelledby="policy-dialog-title"><div class="policy-dialog-head"><div><h2 id="policy-dialog-title">' + (editor.mode === 'batch' ? '批量设置用户限制策略' : '编辑用户限制策略') + '</h2><div class="muted">' + escapeHTML(target) + '</div></div><button class="small" data-action="close-policy-editor" ' + (editor.saving ? 'disabled' : '') + '>关闭</button></div><div class="policy-dialog-section"><div class="field"><label>选择或搜索当前支持模型</label><div class="model-picker"><input id="editor-model-choice" data-editor-model list="editor-model-options" value="" placeholder="输入或选择模型 ID"><datalist id="editor-model-options">' + modelOptions + '</datalist><button class="secondary" data-action="add-editor-model" ' + (editor.saving ? 'disabled' : '') + '>添加模型</button></div>' + (state.modelLoading ? '<div class="model-status">模型目录加载中…</div>' : state.modelError ? '<div class="model-status error">' + escapeHTML(state.modelError) + '</div>' : '<div class="model-status">已加载 ' + escapeHTML(state.models.length) + ' 个当前支持模型</div>') + modelHint + '<div class="chips">' + chips + '</div><button class="small danger" data-action="clear-editor-models" ' + (editor.saving || (!editor.deniedModels.length && !editor.modelsMixed) ? 'disabled' : '') + '>清空禁止列表</button></div></div><div class="policy-dialog-section"><div class="field">' + auditControl + '</div><p class="hint">批量只修改审计开关时，插件会逐个 Key 更新，不会覆盖已有模型限制。</p></div><div class="policy-dialog-actions"><button class="secondary" data-action="close-policy-editor" ' + (editor.saving ? 'disabled' : '') + '>取消</button><button class="primary" data-action="save-policy-editor" ' + (editor.saving ? 'disabled' : '') + '>' + (editor.saving ? '保存中…' : '保存策略') + '</button></div></div></div>';
      };
      const renderSettings = () => { const settings = state.settings || {}; return '<section class="panel"><div class="panel-head"><h2>插件设置</h2></div><div class="filters" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="field"><label>保留天数</label><input id="retention" type="number" min="1" max="3650" value="' + escapeHTML(settings.retention_days || '') + '"></div><div class="field"><label>最大文本字节数</label><input id="max-text" type="number" min="1" value="' + escapeHTML(settings.max_text_bytes || '') + '"></div><div class="field"><label>缺省审计</label><label class="check"><input id="default-audit" type="checkbox" ' + (settings.default_audit_enabled !== false ? 'checked' : '') + '>开启</label></div></div><button class="primary" data-action="save-settings">保存设置</button><p class="footer-note">修改保留天数会同时触发过期数据清理。插件配置仍由通用插件中心管理。</p></section>'; };
      const saveSettings = async () => { const retention = Number($('#retention').value); const maxText = Number($('#max-text').value); const defaultAudit = $('#default-audit').checked; try { state.settings = await callHost('PUT', API + '/settings', {retention_days:retention, max_text_bytes:maxText, default_audit_enabled:defaultAudit}); showToast('设置已保存'); render(); } catch (error) { showToast(error.message || '设置保存失败'); } };
      const toggleGroup = (group, checked) => { if (checked) state.selectedGroups.add(group.id); else state.selectedGroups.delete(group.id); render(); };
      const toggleAllGroups = (checked) => { filteredPolicyGroups().forEach((group) => checked ? state.selectedGroups.add(group.id) : state.selectedGroups.delete(group.id)); render(); };
      const bindEvents = () => {
        document.querySelectorAll('[data-tab]').forEach((node) => node.addEventListener('click', () => { state.tab = node.dataset.tab; render(); }));
        document.querySelectorAll('[data-filter]').forEach((node) => {
          const updateFilter = () => { state.filters[node.dataset.filter] = node.value; };
          node.addEventListener('input', updateFilter); node.addEventListener('change', updateFilter);
          node.addEventListener('keydown', (event) => { if (event.key === 'Enter' && node.dataset.filter === 'user_name') { event.preventDefault(); void refreshAudit(1); } });
        });
        document.querySelectorAll('[data-policy-search]').forEach((node) => node.addEventListener('input', () => { state.policySearch = node.value; render(); }));
        document.querySelectorAll('[data-group-index]').forEach((node) => node.addEventListener('change', () => { const group = filteredPolicyGroups()[Number(node.dataset.groupIndex)]; if (group) toggleGroup(group, node.checked); }));
        document.querySelectorAll('[data-model-search]').forEach((node) => node.addEventListener('input', () => { if (state.policyEditor) { state.policyEditor.modelSearch = node.value; const choice = $('#editor-model-choice'); if (choice) Array.from(choice.options).forEach((option) => { option.hidden = Boolean(option.value && state.policyEditor.modelSearch && !option.value.includes(state.policyEditor.modelSearch.trim().toLocaleLowerCase())); }); } }));
        document.querySelectorAll('[data-editor-model]').forEach((node) => node.addEventListener('change', () => { if (node.value) { addEditorModel(node.value); } }));
        document.querySelectorAll('[data-editor-audit]').forEach((node) => node.addEventListener('change', () => { if (!state.policyEditor) return; if (state.policyEditor.mode === 'batch') state.policyEditor.auditChoice = node.value; else state.policyEditor.auditEnabled = node.checked; }));
        document.querySelectorAll('[data-action]').forEach((node) => node.addEventListener('click', () => {
          const action = node.dataset.action;
          if (action === 'reload') return load();
          if (action === 'filter') return refreshAudit(1);
          if (action === 'prev') return refreshAudit(Math.max(1, (state.pagination.page || 1) - 1));
          if (action === 'next') return refreshAudit((state.pagination.page || 1) + 1);
          if (action === 'detail') return detail(node.dataset.id);
          if (action === 'close-detail') { state.detail = null; render(); return; }
          if (action === 'refresh-policies') return refreshPolicies();
          if (action === 'toggle-all-groups') return toggleAllGroups(node.checked);
          if (action === 'edit-group') { const group = filteredPolicyGroups()[Number(node.dataset.groupIndex)]; if (group) openPolicyEditor(group, 'single'); return; }
          if (action === 'batch-policy') { const groups = buildPolicyGroups().filter((group) => state.selectedGroups.has(group.id)); if (groups.length) { const hashes = Array.from(new Set(groups.flatMap((group) => group.hashes))); openPolicyEditor({id:'batch', userName:groups.length + ' 个用户', email:'', department:'', hashes}, 'batch'); } return; }
          if (action === 'close-policy-editor') return closePolicyEditor();
          if (action === 'save-policy-editor') return savePolicyEditor();
          if (action === 'remove-editor-model') return removeEditorModel(node.dataset.model);
          if (action === 'clear-editor-models') { if (state.policyEditor) { state.policyEditor.deniedModels = []; state.policyEditor.modelsChanged = true; render(); } return; }
          if (action === 'add-editor-model') { const input = $('#editor-model-choice'); if (input && input.value) addEditorModel(input.value); return; }
          if (action === 'save-settings') return saveSettings();
        }));
      };
      const load = async () => {
        state.loading = true; render();
        try {
          const metadataPromise = loadKeyMetadata();
          const [settings, policies, audit] = await Promise.all([callHost('GET', API + '/settings'), callHost('GET', API + '/policies'), loadAudit(1)]);
          await metadataPromise;
          state.settings = settings || null; state.policies = Array.isArray(policies && policies.policies) ? policies.policies : [];
          await loadSupportedModels();
          if (audit) applyAudit(audit);
          state.loading = false; render(); startAutoRefresh();
        } catch (error) { state.loading = false; renderError(error && error.message ? error.message : '插件管理接口不可用'); }
      };
      load();
    })();
  </script>
</body>
</html>
