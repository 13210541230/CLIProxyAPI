<body>
  <main id="app"><div class="loading">正在连接插件管理接口…</div></main>
  <div id="toast" class="toast"></div>
  <script>
    (() => {
      'use strict';
      const API = '/v0/management/enterprise-access-audit';
      const hostOrigin = (() => {
        try {
          const explicit = new URLSearchParams(window.location.search).get('cpa_plugin_host_origin');
          if (explicit && new URL(explicit).origin === explicit) return explicit;
          return document.referrer ? new URL(document.referrer).origin : '*';
        } catch (_) { return '*'; }
      })();
      const pending = new Map();
      let sequence = 0;
      const state = {
        tab:'audit', records:[], policies:[], settings:null, keyMetadata:[], metadataError:'',
        models:[], modelLoading:false, modelError:'',
        pagination:{page:1,page_size:25,total:0,has_next:false},
        filters:{user_name:'',key_hash:'',model:'',source_format:'',outcome:'',security_signal:''},
        filterDraft:{user_name:'',key_hash:'',model:'',source_format:'',outcome:'',security_signal:''}, auditUserPickerOpen:false,
        policySearch:'', selectedGroups:new Set(), selectedDepartments:new Set(), departmentQuery:'', departmentPickerOpen:false, policyEditor:null, modelQuery:'', modelPickerOpen:false, detail:null, loading:false
      };
      let refreshTimer = 0;
      let auditRefreshBusy = false;
      const $ = (selector) => document.querySelector(selector);
      const escapeHTML = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const renderInline = (value) => {
        const codeTokens = [];
        let text = escapeHTML(value);
        text = text.replace(/`([^`\n]+)`/g, (_, code) => { const token = '\u0000code' + codeTokens.length + '\u0000'; codeTokens.push('<code>' + code + '</code>'); return token; });
        text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => '<a href="' + url + '" target="_blank" rel="noreferrer noopener">' + label + '</a>');
        text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
        text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
        text = text.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
        return text.replace(/\u0000code(\d+)\u0000/g, (_, index) => codeTokens[Number(index)] || '');
      };
      const renderMarkdown = (value) => {
        const lines = String(value == null ? '' : value).replace(/\r\n/g, '\n').split('\n');
        let html = ''; let paragraph = []; let listOpen = false; let codeOpen = false; let codeLines = [];
        const flushParagraph = () => { if (paragraph.length) { html += '<p>' + paragraph.map(renderInline).join('<br>') + '</p>'; paragraph = []; } };
        const closeList = () => { if (listOpen) { html += '</ul>'; listOpen = false; } };
        const closeCode = () => { if (codeOpen) { html += '<pre><code>' + escapeHTML(codeLines.join('\n')) + '</code></pre>'; codeLines = []; codeOpen = false; } };
        lines.forEach((line) => {
          if (codeOpen) { if (/^```\s*$/.test(line)) closeCode(); else codeLines.push(line); return; }
          if (/^```/.test(line)) { flushParagraph(); closeList(); codeOpen = true; return; }
          if (!line.trim()) { flushParagraph(); closeList(); return; }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { flushParagraph(); closeList(); const level = heading[1].length; html += '<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>'; return; }
          const listItem = line.match(/^\s*[-*+]\s+(.+)$/);
          if (listItem) { flushParagraph(); if (!listOpen) { html += '<ul>'; listOpen = true; } html += '<li>' + renderInline(listItem[1]) + '</li>'; return; }
          if (listOpen) closeList();
          const quote = line.match(/^\s*>\s?(.*)$/);
          if (quote) { flushParagraph(); html += '<blockquote>' + renderInline(quote[1]) + '</blockquote>'; return; }
          paragraph.push(line);
        });
        flushParagraph(); closeList(); closeCode();
        return html || '<p class="muted">文本为空</p>';
      };
      const normalizeModel = (value) => String(value == null ? '' : value).trim().toLowerCase();
      const normalizeModels = (values) => Array.from(new Set((Array.isArray(values) ? values : [values]).map(normalizeModel).filter(Boolean))).sort((left, right) => left.localeCompare(right));
      const normalizeKeyHash = (value) => String(value || '').trim().toLowerCase();
      const shortHash = (value) => normalizeKeyHash(value).slice(0, 8);
      const maskHash = (value) => { const text = normalizeKeyHash(value); return text.length > 12 ? text.slice(0,8) + '…' + text.slice(-4) : text || '-'; };
      const metadataForHash = (value) => {
        const hash = shortHash(value);
        if (!hash) return [];
        return state.keyMetadata.filter((item) => shortHash(item && item.apiKeyHash) === hash);
      };
      const metadataForUserQuery = (value) => {
        const query = String(value || '').trim().toLocaleLowerCase();
        if (!query) return state.keyMetadata;
        return state.keyMetadata.filter((item) => {
          const userName = String(item && item.userName || '').trim().toLocaleLowerCase();
          const email = String(item && item.email || '').trim().toLocaleLowerCase();
          const department = departmentNameForMetadata(item).toLocaleLowerCase();
          const departmentId = String(item && item.departmentId || '').trim().toLocaleLowerCase();
          return userName.includes(query) || email.includes(query) || department.includes(query) || departmentId.includes(query);
        });
      };
      const userLabelForHash = (value) => {
        const matches = metadataForHash(value);
        const names = Array.from(new Set(matches.map((item) => String(item && item.userName || '').trim()).filter(Boolean)));
        if (names.length === 1) return names[0];
        if (names.length > 1) return '多个用户（Hash 前缀重复）';
        return '未关联用户';
      };
      const userCellForHash = (value) => {
        const matches = metadataForHash(value);
        if (matches.length !== 1) return '<strong>' + escapeHTML(userLabelForHash(value)) + '</strong>';

          '<section class="ap-step"><div class="ap-step-head"><span class="ap-step-number">1</span><div><h3>选择或创建账号池</h3><p>账号池是 Codex 认证账号的隔离分组，例如“研发部”“客服部”。</p></div></div><div class="ap-pool-grid"><div><div class="ap-field-caption">已有账号池</div><ul class="pool-list">' + poolOptions + '</ul></div><div><div class="ap-field-caption">创建新账号池</div><div class="ap-create-form"><input data-ap-new-id value="' + escapeHTML(state.ap.newPoolId) + '" placeholder="唯一标识，例如 engineering"><input data-ap-new-name value="' + escapeHTML(state.ap.newPoolName) + '" placeholder="显示名称，例如 研发部"><button class="primary" data-action="ap-create" ' + (state.ap.busy ? 'disabled' : '') + '>创建账号池</button></div>' + (selectedPool ? '<div class="ap-selected-actions"><span>当前选择：<strong>' + escapeHTML(selectedPool.name) + '</strong></span><input data-ap-rename value="' + escapeHTML(selectedPool.name) + '" placeholder="修改显示名称"><button class="small" data-action="ap-rename">重命名</button><button class="small" data-action="ap-toggle">' + (selectedPool.enabled ? '停用' : '启用') + '</button><button class="small danger" data-action="ap-remove">删除</button></div>' : '<p class="ap-inline-empty">创建或选择账号池后继续下一步。</p>') + '</div></div></section>' +
          '<section class="ap-step"><div class="ap-step-head"><span class="ap-step-number">2</span><div><h3>添加 Codex 账号</h3><p>只会把选中的认证文件加入当前账号池；保存时不会影响其他账号池。</p></div></div><div class="ap-step-body">' + (selectedPool ? '<div class="ap-toolbar"><span class="selection-count">' + escapeHTML(memberSummary) + '</span><div><button type="button" data-action="ap-select-all-members">全选可见</button><button type="button" data-action="ap-clear-members" ' + (draftMemberIds.length ? '' : 'disabled') + '>清空成员</button></div></div><div class="ap-members">' + memberRows + '</div><button class="primary" data-action="ap-save-members" ' + (state.ap.busy ? 'disabled' : '') + '>保存成员到此池</button>' : '<div class="ap-empty"><strong>请先完成第 1 步</strong><span>选择一个账号池后，才能添加 Codex 账号。</span></div>') + '</div></section>' +
          '<section class="ap-step"><div class="ap-step-head"><span class="ap-step-number">3</span><div><h3>绑定 Enterprise Key 用户</h3><p>绑定后，该用户的请求只会在当前账号池中选择认证账号。</p></div></div><div class="ap-step-body">' + (selectedPool ? '<div class="ap-binding-toolbar"><div class="field"><label>选择部门</label><select data-ap-dept><option value="">选择部门</option>' + depts.map((dept) => '<option value="' + escapeHTML(dept.id) + '" ' + (dept.id === state.ap.selectedDeptId ? 'selected' : '') + '>' + escapeHTML(dept.name) + '</option>').join('') + '</select></div><div class="ap-toolbar"><span class="selection-count">已选择 ' + state.ap.selectedDeptHashes.length + ' 个用户</span><div><button type="button" data-action="ap-select-all-users" ' + (deptKeys.length ? '' : 'disabled') + '>全选本部门</button><button type="button" data-action="ap-clear-users" ' + (state.ap.selectedDeptHashes.length ? '' : 'disabled') + '>清空选择</button></div></div></div><div class="ap-users">' + deptRows + '</div><div class="ap-actions"><button class="primary" data-action="ap-bind" ' + (state.ap.selectedDeptHashes.length && !state.ap.busy ? '' : 'disabled') + '>将所选用户绑定到当前池</button><button class="small" data-action="ap-clear-dept" ' + (state.ap.selectedDeptId ? '' : 'disabled') + '>清除本部门绑定</button></div>' : '<div class="ap-empty"><strong>请先完成第 1 步</strong><span>选择一个账号池后，才能绑定用户。</span></div>') + '</div></section>' +
          '<section class="ap-step"><div class="ap-step-head"><span class="ap-step-number">4</span><div><h3>设置账号级并发保护</h3><p>每一行对应一个认证文件，只限制该账号。账号达到上限时会先等待空闲槽位，超时后返回可重试的 account_busy；填写 0 表示不限制。</p></div></div><div class="ap-step-body"><div class="table-wrap"><table class="table"><thead><tr><th>认证文件 / 账号</th><th>最大并发</th><th>窗口内最大请求</th><th>窗口秒</th><th>操作</th></tr></thead><tbody>' + limitRows + '</tbody></table></div><button class="primary" data-action="ap-save-limits" ' + (draftMemberIds.length && !state.ap.busy ? '' : 'disabled') + '>保存账号级并发限制</button></div></section></section>';
      };
      const setApLimit = (authId, key, value) => { let item = state.ap.limits.find((l) => l.authId === authId); if (!item) { item = { authId, limit: 0, limit15s: 0, windowSeconds: 15 }; state.ap.limits.push(item); } item[key] = value; };
      const load = async () => {
        state.loading = true; render();
        try {
          const metadataPromise = loadKeyMetadata();
          const [settings, policies, audit] = await Promise.all([callHost('GET', API + '/settings'), callHost('GET', API + '/policies'), loadAudit(1)]);
          await metadataPromise;
          state.settings = settings || null; state.policies = Array.isArray(policies && policies.policies) ? policies.policies : [];
          await loadSupportedModels();
          if (audit) applyAudit(audit);
          state.loading = false; render(); startAutoRefresh();
        } catch (error) { state.loading = false; renderError(error && error.message ? error.message : '插件管理接口不可用'); }
      };
      load();
    })();
  </script>
</body>
</html>
